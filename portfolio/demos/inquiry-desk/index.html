<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inquiry Desk — демо Tercia</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;color:#242336}main{padding:16px;border:1px solid #e0dcf0;background:#f6f3fc;border-radius:14px}h2,h3,p{margin:0 0 8px}button{padding:9px 13px;margin:6px 4px 0 0;border:1px solid #49316e;border-radius:8px;color:#261742;background:#e8dafa;font:inherit;font-weight:650;cursor:pointer}.grid{display:grid;gap:10px}@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}article{padding:14px;border-radius:12px;background:white}a{color:#3f286a}#status{margin-top:10px}[hidden]{display:none!important}.portfolio-return{margin:1.5rem auto;text-align:center}.portfolio-return a{color:inherit;text-decoration:underline}</style><main><h2>Inquiry Desk</h2><p>Внутреннее демо на тестовых данных</p><div class="grid"><article><h3>Форма поставщика</h3><p>Упаковочные материалы для склада<br>test@example.com</p><button id="submit">Посмотреть демо</button><button id="error">Показать ошибку</button><p id="status" role="status">Готово к тестовой отправке.</p></article><article><h3>Общая очередь</h3><div id="queue" hidden><p>Заявок: <strong>1</strong> · INQ-001</p><p>Ответственная: Мария<br>Тестовое уведомление создано</p></div><div id="actions" hidden><button id="reset">Начать заново</button></div></article></div></main><p class="portfolio-return"><a href="../../#project-demos">К портфолио Tercia</a></p><script>
let sent=false;
const root=document.querySelector('main');

root.onclick=event=>{
 const button=event.target.closest('button');
 if(!button)return;
 root.querySelector('#actions').hidden=false;
 const status=root.querySelector('#status');
 const queue=root.querySelector('#queue');
 if(button.id==='reset'){sent=false;queue.hidden=true;status.textContent='Готово к тестовой отправке.';root.querySelector('#submit').textContent='Отправить тестовую заявку';return;}
 if(button.id==='error'){status.innerHTML='Не удалось подтвердить отправку. Повторите попытку или напишите на <a href="mailto:info@tercia.dev">info@tercia.dev</a>.';return;}
 status.textContent=sent?'Повтор обработан. Очередь содержит одну заявку.':'Тестовая заявка принята.';
 sent=true;queue.hidden=false;root.querySelector('#submit').textContent='Повторить отправку';
};</script></html>
